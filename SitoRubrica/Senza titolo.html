<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubrica Smart</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            text-align: center;
            transition: all 0.5s ease-in-out;
        }
        .hero {
            background: linear-gradient(135deg, #ff0080, #6100ff);
            padding: 60px 20px;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(255, 0, 128, 0.3);
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3em;
            font-weight: bold;
            margin: 0;
        }
        .btn {
            background: #ff5555;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            text-decoration: none;
            border-radius: 50px;
            margin: 10px;
            transition: background 0.3s, transform 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #ff79c6;
            transform: scale(1.1);
        }
        .dark-mode {
            background: linear-gradient(135deg, #000000, #333333);
            color: #ffffff;
        }
        .floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00c2ff;
            padding: 15px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0px 5px 15px rgba(0, 194, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Rubrica Smart</h1>
        <p>Gestisci i tuoi contatti con stile e velocità.</p>
        <button class="btn" onclick="showAlert()">Scopri di più</button>
        <button class="btn" onclick="toggleTheme()">Cambia Tema</button>
        <a href="dettagli.html" class="btn">Vai ai Dettagli</a>
    </div>
    
    <p>&copy; 2025 Tutti i diritti riservati.</p>
    
    <div class="floating-btn" onclick="scrollToTop()">⬆</div>
    
    <script>
        function showAlert() {
            const modal = document.createElement('div');
            modal.style.position = 'fixed';
            modal.style.top = '50%';
            modal.style.left = '50%';
            modal.style.transform = 'translate(-50%, -50%)';
            modal.style.background = '#222';
            modal.style.padding = '20px';
            modal.style.borderRadius = '10px';
            modal.style.boxShadow = '0px 5px 20px rgba(255, 105, 180, 0.5)';
            modal.innerHTML = '<p>Funzione in sviluppo! Torna presto.</p><button onclick="closeModal(this)" class="btn">Chiudi</button>';
            document.body.appendChild(modal);
        }
        function closeModal(button) {
            button.parentElement.remove();
        }
        function toggleTheme() {
            document.body.classList.toggle("dark-mode");
            document.querySelector('.hero').style.transform = 'rotate(360deg) scale(1.1)';
            setTimeout(() => {
                document.querySelector('.hero').style.transform = 'scale(1)';
            }, 500);
        }
        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
